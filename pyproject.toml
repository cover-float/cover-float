[project]
name = "cover-float"
version = "0.1.0"
description = "Test Generators With Coverage for the IBM Floating Point Tests"
readme = "README.md"
authors = [
    { name = "Corey Hickson", email = "chickson@hmc.edu" },
    { name = "Ryan Wolk", email = "rwolk@hmc.edu" },
    { name = "Lamarr Olive", email = "lolive@g.hmc.edu" },
    { name = "Sisi Wang", email = "siswang@g.hmc.edu" },
    { name = "Angela Zheng", email = "angzheng@g.hmc.edu" },
]
requires-python = ">=3.10"
dependencies = [
    "rich>=14.3.4",
    "sympy==1.14.0",
]

[project.scripts]
cover-float-testgen = "cover_float.cli:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.{h,c,hpp,cpp}" }, { file = "CMakeLists.txt" }]

[build-system]
requires = ["scikit-build-core>=0.10", "pybind11"]
build-backend = "scikit_build_core.build"

[dependency-groups]
dev = [
    "pre-commit==4.3.0",
    "pyright==1.1.414",
    "ruff==0.16.7",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Extra rules to enable beyond the default set
extend-select = [
  "A",   # shadow builtins
  "ANN", # type annotation rules
  "ISC", # Implicit string concatenation
  "PTH", # Use Pathlib
  "SIM", # Simplifications
  "TID", # Tidy imports
]
ignore = [
  "N", # Naming requirements
]

##### PYRIGHT CONFIG #####
[tool.pyright]
exclude = [
  "**/__pycache__",
  "**/.*",
  ".venv",
]
typeCheckingMode = "strict"
