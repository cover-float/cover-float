# Modified by rwolk@hmc.edu on 6 Jul 2026

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only run CI on the latest commit if a PR is updated
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    name: Pre-commit check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Ensure pre-commit checks pass
        run: uv run prek run --all-files --show-diff-on-failure --color=always

  testgen:
    name: Run all Test Generation
    strategy:
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-latest
            image: null
            install: null

          - name: Alpine (musl)
            os: ubuntu-latest
            image: alpine:latest
            install: apk add --no-cache git bash make cmake build-base

          - name: MacOS (clang)
            os: macos-latest
            image: null
            install: null

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.image }}

    steps:
      - name: Install Utilities
        if: ${{ matrix.install != null }}
        run: ${{ matrix.install }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Generate Tests
        run: make all
