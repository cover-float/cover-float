name: CI

on:
  merge_group:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only run CI on the latest commit if a PR is updated
concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Pre-commit check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Ensure pre-commit checks pass
        run: uv run prek run --all-files --show-diff-on-failure --color=always

  testgen:
    name: Run all Test Generation (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-latest

          - name: Alpine (musl)
            os: ubuntu-latest
            image: alpine:latest@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
            install: apk add --no-cache git bash make cmake build-base

          - name: MacOS (clang)
            os: macos-latest

    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    container: ${{ matrix.image }}

    steps:
      - name: Install Utilities
        if: ${{ matrix.install }}
        run: ${{ matrix.install }}

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Generate Tests
        run: make all

  coverage:
    name: Check Coverage with Verilator
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: verilator/verilator:latest@sha256:da7845c38c2ab84133661a1b1e2d717d028fe0bc629cc06c77bb80571e610448

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Generate Tests
        run: make all

      - name: Run Coverage
        run: make update-verilator-report
        continue-on-error: true

      - name: Diff Coverage
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code -- reports/verilator.txt

  # Single required status check for branch protection and the merge queue.
  # Required checks cannot reference a matrix job by its ID.
  ci_pass:
    name: CI pass
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, testgen, coverage]
    if: ${{ always() }}
    steps:
      - name: Job status check
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [[ "$result" == "success" ]] || exit 1
          done
