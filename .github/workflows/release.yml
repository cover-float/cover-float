# Build the sdist and all wheels for a GitHub release, then publish them to PyPI.
# Publishing uses PyPI trusted publishing from the protected "pypi" environment.

name: Release

on:
  release:
    types: [published]

# Run one release at a time, and never cancel a release that has started.
# The "-caller" part keeps this group different from groups in called workflows.
concurrency:
  group: ${{ github.workflow }}-caller
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-version:
    name: Check release version
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check that the tag matches the version in pyproject.toml
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ "$TAG" != "v$version" ]]; then
            echo "::error::Release tag $TAG does not match pyproject.toml version $version (expected v$version)"
            exit 1
          fi

  build:
    name: Build
    needs: check-version
    uses: ./.github/workflows/wheels.yml
    with:
      full: true

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/cover-float
    permissions:
      id-token: write

    steps:
      - name: Download sdist and wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Generate attestations
        uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
