# Build the sdist, then build and test wheels from that sdist.
# CI.yml and release.yml call this workflow.

name: Wheels

on:
  workflow_call:
    inputs:
      full:
        description: Build every wheel. If false, build one wheel for each OS.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Build sdist
        run: uv build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

      # The small set builds the oldest Python on Linux and the newest on macOS.
      - name: Define wheel matrix
        id: matrix
        env:
          FULL: ${{ inputs.full }}
        run: |
          if [[ "$FULL" == "true" ]]; then
            matrix='[
              {"name": "Linux x86_64 glibc", "os": "ubuntu-latest", "build": "cp3*-manylinux_x86_64", "artifact": "manylinux-x86_64"},
              {"name": "Linux x86_64 musl", "os": "ubuntu-latest", "build": "cp3*-musllinux_x86_64", "artifact": "musllinux-x86_64"},
              {"name": "Linux aarch64 glibc", "os": "ubuntu-24.04-arm", "build": "cp3*-manylinux_aarch64", "artifact": "manylinux-aarch64"},
              {"name": "Linux aarch64 musl", "os": "ubuntu-24.04-arm", "build": "cp3*-musllinux_aarch64", "artifact": "musllinux-aarch64"},
              {"name": "macOS arm64", "os": "macos-latest", "build": "cp3*-macosx_arm64", "artifact": "macosx-arm64"}
            ]'
          else
            matrix='[
              {"name": "Linux x86_64 glibc", "os": "ubuntu-latest", "build": "cp310-manylinux_x86_64", "artifact": "manylinux-x86_64"},
              {"name": "macOS arm64", "os": "macos-latest", "build": "cp315-macosx_arm64", "artifact": "macosx-arm64"}
            ]'
          fi
          echo "matrix=$(jq -c . <<< "$matrix")" >> "$GITHUB_OUTPUT"

  wheels:
    name: Build wheels (${{ matrix.name }})
    needs: sdist
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.sdist.outputs.matrix) }}

    steps:
      - name: Download sdist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: sdist

      - name: Find sdist
        id: sdist
        shell: bash
        run: echo "path=$(ls sdist/*.tar.gz)" >> "$GITHUB_OUTPUT"

      # cibuildwheel uses uv as the build frontend. The Linux build images include uv, but the macOS runners do not.
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Build and test wheels
        uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        with:
          package-dir: ${{ steps.sdist.outputs.path }}
        env:
          CIBW_BUILD: ${{ matrix.build }}

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.artifact }}
          path: wheelhouse/*.whl
          if-no-files-found: error
